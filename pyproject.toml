[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-plan-ai-api"
version = "0.1.0"
description = "AI microservice that drafts care plan entries from resident assessments and care-plan history."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "structlog>=24.4",
    "tenacity>=9.0",
    "slowapi>=0.1.9",
    "tiktoken>=0.8",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "pinecone>=7,<8",
    # Encrypts the AI wording kept in agent memory (memory/sealing.py).
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises the real FastAPI app through TestClient",
]
