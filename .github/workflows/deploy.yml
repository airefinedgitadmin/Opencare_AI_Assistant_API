name: Test, build and deploy care-plan-ai-api

# Push to main (or Actions -> Run workflow) runs the whole pipeline:
#   test -> migrate Supabase -> build + push image -> deploy to Container Apps
# Nothing reaches Azure unless the tests pass, and the new revision only goes
# live after the database migrations have been applied.
#
# Azure login is OIDC (no stored Azure credentials). Repository variables
# (Settings -> Secrets and variables -> Actions -> Variables):
#   AZURE_CLIENT_ID         identity with a federated credential for this repo's
#                           main branch, Contributor on rg-oc-careplan-ai
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#
# No repository secrets. The app's own settings and secrets (CAREPLAN_AI_*,
# including the database the migrate job uses) live on the Container App in
# Azure, not here: this pipeline only swaps the image. Change them in the
# portal (careplan-ai-api -> Containers -> Environment variables / Secrets) or
# with `az containerapp update --set-env-vars` - see DEPLOYMENT_CHECKLIST.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a live rollout.
concurrency:
  group: deploy-careplan-ai
  cancel-in-progress: false

env:
  ACR_NAME: ocareplanaiacr
  REGISTRY: ocareplanaiacr.azurecr.io
  IMAGE: care-plan-ai-api
  RESOURCE_GROUP: rg-oc-careplan-ai
  CONTAINER_APP: careplan-ai-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Lets tests/integration/test_migrations.py run instead of skipping.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        env:
          CAREPLAN_AI_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  migrate:
    needs: test
    uses: ./.github/workflows/db-migrate.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Built inside ACR itself (no Docker daemon or registry password on the
      # runner). Tagged with the commit SHA so every deploy is a distinct,
      # traceable image (and a rollback is just redeploying an older tag);
      # :latest is kept for manual use.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --image "$IMAGE:latest" \
            .

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Only the image changes; the env vars and secrets already on the app
      # (set in Azure, see DEPLOYMENT_CHECKLIST.md) carry over to the new revision.
      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:${{ github.sha }}" \
            --min-replicas 0 --max-replicas 2 \
            --only-show-errors --output none

      - name: Health check
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # Scale-to-zero means the first request cold-starts a replica.
          for i in $(seq 1 12); do
            if curl -fsS "https://$fqdn/healthz"; then
              echo
              echo "Live at https://$fqdn"
              exit 0
            fi
            echo "Not ready yet ($i/12), retrying in 10s"
            sleep 10
          done
          echo "::error::https://$fqdn/healthz did not respond"
          exit 1
