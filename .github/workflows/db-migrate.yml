name: Migrate agent memory database (Supabase)

# The ONLY way schema changes reach Supabase. Runs as a step of deploy.yml on
# every push to main (before the new app revision goes live), and can be run on
# its own from Actions -> Run workflow. Already-applied migrations are skipped,
# so re-running is safe. Locally, developers run the same runner against their
# own Postgres:
#   python -m careplan_ai.memory.migrate --create-database
#
# No database secret in GitHub: the connection settings (CAREPLAN_AI_DB_* /
# CAREPLAN_AI_MEMORY_DB_URL) are read from the Container App, where
# scripts/set-container-app-env.ps1 puts them from .env. Needs the same
# AZURE_* repository variables as deploy.yml.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

# Never run two migrations against the same database at once.
concurrency:
  group: db-migrate-supabase
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-oc-careplan-ai
  CONTAINER_APP: careplan-ai-api

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration runner dependencies
        run: pip install "psycopg[binary]>=3.2" "pydantic-settings>=2.6"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Copies only the database settings from the app into this job's
      # environment; secret values are masked in the log.
      - name: Read database settings from the Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          app=(--name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP")
          db_vars="^CAREPLAN_AI_(DB_[A-Z]+|MEMORY_DB_URL)$"

          az containerapp show "${app[@]}" \
            --query "properties.template.containers[0].env[?value!=null].[name, value]" -o tsv |
          while IFS=$'\t' read -r name value; do
            [[ "$name" =~ $db_vars ]] && echo "$name=$value" >> "$GITHUB_ENV"
          done

          az containerapp show "${app[@]}" \
            --query "properties.template.containers[0].env[?secretRef!=null].[name, secretRef]" -o tsv |
          while IFS=$'\t' read -r name ref; do
            [[ "$name" =~ $db_vars ]] || continue
            value=$(az containerapp secret show "${app[@]}" --secret-name "$ref" --query value -o tsv)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Apply pending migrations
        env:
          PYTHONPATH: src
        run: python -m careplan_ai.memory.migrate
